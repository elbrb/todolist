<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cruscotto attività — Controlling</title>

<style>
  :root{
    color-scheme:dark;
    --scrivania:#1E1E1E;    /* area attorno al foglio */
    --barra:#2B2B2B;        /* barra dei menu, grigio scuro */
    --nastro:#333333;       /* nastro / schede */
    --foglio:#262626;       /* celle */
    --hover:#313131;
    --intest:#3D3D3D;       /* intestazioni di riga e colonna */
    --griglia:#3A3A3A;      /* linee della griglia */
    --bordo:#4E4E4E;
    --bordo2:#5C5C5C;
    --text:#E8E8E8;
    --dim:#B2B2B2;
    --debole:#828282;
    --verde:#4FA46A;        /* cella attiva, come nel foglio di calcolo */
    --verde-chiaro:#2C4A38;
    --rosso:#D96B66;
    --ambra:#D5A24E;
    --azzurro:#7FA3CC;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--scrivania);color:var(--text);
    font-family:"Segoe UI","Segoe UI Variable",system-ui,-apple-system,"Helvetica Neue",sans-serif;
    font-size:13.5px;line-height:1.4;-webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 0 70px;background:var(--scrivania);
    box-shadow:0 0 0 1px var(--bordo)}
  ::selection{background:#3A5C48;color:#F2F2F2}

  /* ---------- barra del titolo ---------- */
  header{display:flex;flex-wrap:wrap;align-items:center;gap:16px;justify-content:space-between;
    background:var(--barra);border-bottom:1px solid var(--bordo2);padding:7px 14px}
  .titolo{display:flex;align-items:center;gap:11px;min-width:0}
  .eyebrow{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);margin:0}
  h1{font-weight:600;font-size:15px;margin:0;line-height:1.2}
  .meters{display:flex;flex-wrap:wrap;border:1px solid var(--bordo);background:var(--foglio)}
  .meter{padding:3px 12px;border-right:1px solid var(--griglia);min-width:90px;
    display:flex;align-items:baseline;gap:7px}
  .meter:last-child{border-right:0}
  .meter b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .meter span{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--dim)}
  .meter.alert b{color:var(--rosso)}
  .meter.wip b{color:var(--ambra)}
  .meter.ok b{color:var(--verde)}

  /* ---------- schede tipo nastro ---------- */
  .tabs{display:flex;flex-wrap:wrap;gap:0;background:var(--nastro);
    border-bottom:1px solid var(--bordo);padding:0 8px}
  .tab{border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;
    font:400 13px/1 inherit;color:var(--text);padding:9px 14px;
    display:inline-flex;align-items:center;gap:8px;transition:background .1s}
  .tab:hover{background:#3C3C3C}
  .tab[aria-selected="true"]{background:var(--scrivania);border-bottom-color:var(--verde);font-weight:600}
  .tab .n{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;
    border:1px solid var(--bordo);background:var(--foglio);padding:0 5px;border-radius:2px}
  .tab[aria-selected="true"] .n{color:var(--verde);border-color:var(--verde)}
  .tab:focus-visible{outline:1px dotted var(--text);outline-offset:-3px}

  /* ---------- barra della formula ---------- */
  .toolbar{display:flex;align-items:center;gap:10px;min-height:24px;padding:4px 10px;
    border-bottom:1px solid var(--bordo);background:var(--nastro)}
  .saved{font-size:11.5px;color:var(--verde);opacity:0;transition:opacity .3s}
  .saved.on{opacity:1}

  section{margin:0 14px 24px}
  .wrap > #board{padding-top:16px}
  .sec-head{display:flex;align-items:center;gap:11px;padding:0 0 7px}
  .sec-head h2{font-weight:600;font-size:14px;margin:0;display:flex;align-items:center;gap:8px}
  .sec-head h2::before{content:"";width:10px;height:10px;background:var(--acc);border:1px solid rgba(0,0,0,.45)}
  .tally{font-size:11.5px;color:var(--dim);margin-right:auto;font-variant-numeric:tabular-nums}
  .btn{border:1px solid var(--bordo);background:linear-gradient(#3B3B3B,#2F2F2F);color:var(--text);
    font:400 12.5px/1 inherit;padding:6px 12px;border-radius:2px;cursor:pointer}
  .btn:hover{background:linear-gradient(#474747,#383838);border-color:var(--verde)}
  .btn:active{background:#242424}
  .btn:focus-visible{outline:1px dotted var(--text);outline-offset:2px}

  /* ---------- griglia ---------- */
  .cols,.row{display:grid;
    grid-template-columns:34px minmax(0,2.3fr) 116px 88px minmax(0,1fr) 142px 30px 30px;gap:0}
  section[data-sec="urgenti"] .cols,
  section[data-sec="urgenti"] .row{
    grid-template-columns:34px minmax(0,2.3fr) 116px 88px minmax(0,1fr) 142px 30px 30px 30px}
  .cols{background:var(--intest);border:1px solid var(--bordo);border-bottom:0;
    font-size:11.5px;color:var(--dim);text-align:center}
  .cols::before{content:""}
  .cols > *,.cols::before{padding:4px 7px;border-right:1px solid var(--bordo)}
  .cols > *:last-child{border-right:0}

  .body{counter-reset:riga}
  .row{background:var(--foglio);border:1px solid var(--bordo);border-top:0;align-items:stretch}
  .row:hover{background:var(--hover)}
  .row::before{counter-increment:riga;content:counter(riga);
    display:flex;align-items:center;justify-content:center;
    background:var(--intest);color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;
    border-right:1px solid var(--bordo)}
  .row > div{border-right:1px solid var(--griglia);display:flex;align-items:center;min-height:29px;padding:0 1px}
  .row > div:last-child{border-right:0}
  .row.late{box-shadow:inset 3px 0 0 var(--rosso)}

  input[type=text],input[type=date],select,textarea{
    width:100%;border:1px solid transparent;background:transparent;border-radius:0;
    padding:4px 6px;font:inherit;color:var(--text);min-width:0}
  input[type=text]::placeholder,textarea::placeholder{color:var(--debole)}
  input:hover,select:hover{background:#303030}
  input:focus,select:focus,textarea:focus{outline:none;border:1.5px solid var(--verde);background:#1F1F1F}
  ::-webkit-calendar-picker-indicator{filter:invert(.65)}
  select option{background:#2B2B2B;color:var(--text)}
  input[type=date]{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--dim)}
  .row.late input[type=date]{color:var(--rosso)}

  select{appearance:none;cursor:pointer;font-size:12.5px;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 12px) 50%,calc(100% - 7px) 50%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:20px}
  select[data-v="wip"]{color:var(--ambra)}
  select[data-v="done"]{color:var(--verde)}
  select[data-v="todo"]{color:var(--dim)}

  .stars{display:flex;gap:1px;padding-left:4px}
  .stars button{border:0;background:none;padding:2px;cursor:pointer;line-height:0;color:#4F4F4F;transition:color .12s}
  .stars button.lit{color:var(--ambra)}
  .stars button:hover{color:#EBC378}
  .stars button:focus-visible{outline:1px dotted var(--text);outline-offset:1px}
  .stars svg{width:14px;height:14px;display:block}

  .icon{border:1px solid transparent;background:none;cursor:pointer;font-size:13px;line-height:1;
    padding:4px 5px;border-radius:2px;color:var(--dim);position:relative}
  .icon:hover{border-color:var(--bordo);background:#3A3A3A;color:var(--text)}
  .icon.kill:hover{color:var(--rosso)}
  .icon.undo:hover{color:var(--verde)}
  .icon.dup{font-size:12px}
  .icon.dup:hover{color:var(--verde)}
  .icon.has::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;
    border-radius:50%;background:var(--ambra)}
  .icon[aria-expanded="true"]{border-color:var(--bordo);background:#3A3A3A}

  .nota[hidden]{display:none !important}
  .nota:not([hidden]){grid-column:1 / -1;padding:6px 8px 9px;background:#202020;
    border-top:1px solid var(--griglia);display:block !important}
  .nota textarea{font-size:12.5px;line-height:1.5;color:var(--dim);border:1px solid var(--bordo);
    background:#1C1C1C;resize:vertical;min-height:54px}
  .nota .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--debole);
    display:block;margin:0 0 3px 1px}

  .empty{border:1px solid var(--bordo);padding:14px;color:var(--debole);font-size:12.5px;background:var(--foglio)}
  .empty.attaccato{border-top:0}

  /* ---------- riepilogo ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:24px}
  .card{background:var(--foglio);border:1px solid var(--bordo);border-left:3px solid var(--acc);
    padding:11px 14px;text-align:left;cursor:pointer;font:inherit;color:var(--text);border-radius:2px}
  .card:hover{background:var(--hover)}
  .card h3{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 7px;color:var(--dim);font-weight:600}
  .card .big{font-size:26px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
  .card .big em{font-style:normal;font-size:10.5px;color:var(--debole);text-transform:uppercase;margin-left:7px}
  .card .split{display:flex;gap:12px;margin-top:8px;padding-top:7px;border-top:1px solid var(--griglia);
    font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .card .split .bad{color:var(--rosso)}

  .lead{font-size:13px;font-weight:600;margin:0 0 3px;display:flex;align-items:center;gap:9px}
  .lead .st{color:var(--ambra)}
  .sub{font-size:11.5px;color:var(--dim);margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--bordo)}

  .top{border:1px solid var(--bordo)}
  .top-row{display:grid;grid-template-columns:104px minmax(0,1fr) 104px minmax(0,136px) 106px;
    align-items:center;background:var(--foglio);cursor:pointer;
    border-bottom:1px solid var(--griglia);border-left:3px solid var(--acc)}
  .top-row:last-child{border-bottom:0}
  .top-row:hover{background:var(--hover)}
  .top-row > span{padding:7px 9px;border-right:1px solid var(--griglia);min-height:32px;
    display:flex;align-items:center}
  .top-row > span:last-child{border-right:0}
  .top-row .tag{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.03em}
  .top-row .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .top-row .d .flag{color:var(--ambra);margin-left:7px;font-size:11px}
  .top-row .dt{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .top-row .dt.bad{color:var(--rosso)}
  .top-row .cw{font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:11px;border:1px solid currentColor;padding:1px 6px;border-radius:2px;white-space:nowrap}
  .badge.wip{color:var(--ambra)} .badge.todo{color:var(--debole)} .badge.done{color:var(--verde)}

  /* ---------- completati ---------- */
  .mese{margin-bottom:16px}
  .mese-head{display:flex;align-items:center;gap:11px;padding:6px 11px;background:var(--intest);
    border:1px solid var(--bordo)}
  .mese-head h3{font-weight:600;font-size:13px;margin:0}
  .mese-head .c{font-size:11.5px;color:var(--dim);margin-left:auto;font-variant-numeric:tabular-nums}
  .arc{display:grid;grid-template-columns:104px minmax(0,1fr) 96px 70px minmax(0,126px) 30px 30px;
    align-items:center;background:var(--foglio);border:1px solid var(--bordo);border-top:0;
    border-left:3px solid var(--acc)}
  .arc:hover{background:var(--hover)}
  .arc > span{padding:6px 9px;border-right:1px solid var(--griglia);min-height:30px;display:flex;align-items:center}
  .arc > span:last-child{border-right:0}
  .arc .tag{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.03em}
  .arc .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .arc .dt{font-size:12px;color:var(--verde);font-variant-numeric:tabular-nums}
  .arc .cw{font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arc .flag{color:var(--ambra);margin-left:7px;font-size:11px}

  .backup{background:var(--foglio);border:1px solid var(--bordo);padding:13px 15px}
  .backup .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .esito{font-size:11.5px;color:var(--dim)}
  .esito.ko{color:var(--rosso)}
  .esito.ok{color:var(--verde)}

  @media (max-width:860px){
    .cols{display:none}
    .row,section[data-sec="urgenti"] .row{grid-template-columns:1fr 1fr;padding:10px 12px 12px;
      position:relative;border-top:1px solid var(--bordo);margin-bottom:6px;gap:5px 9px}
    .row::before{display:none}
    .row > div{border-right:0;min-height:0;display:block;padding:0}
    .f-desc{grid-column:1 / -1;font-weight:600;padding-right:94px !important}
    .f-cow{grid-column:1 / -1}
    .row > *[data-label]::before{content:attr(data-label);display:block;font-size:10.5px;
      text-transform:uppercase;letter-spacing:.03em;color:var(--debole);margin-bottom:1px;padding-left:1px}
    .f-dup{position:absolute;top:10px;right:66px;width:auto}
    .f-note{position:absolute;top:10px;right:37px;width:auto}
    .f-kill{position:absolute;top:10px;right:8px;width:auto}
    .empty.attaccato{border-top:1px solid var(--bordo)}
    .tabs{padding:0;overflow-x:auto;flex-wrap:nowrap}
    .tab{flex:0 0 auto;padding:10px 12px;font-size:12.5px}
    .top-row{grid-template-columns:1fr auto}
    .top-row > span{border-right:0;min-height:0;padding:2px 10px}
    .top-row > span:first-child{padding-top:9px}
    .top-row > span:last-child{padding-bottom:9px}
    .top-row .tag{order:1} .top-row .badge{order:2;justify-self:end}
    .top-row .d{order:3;grid-column:1 / -1;white-space:normal}
    .top-row .dt{order:4} .top-row .cw{order:5;justify-content:flex-end}
    .arc{grid-template-columns:1fr auto;position:relative;padding-right:70px}
    .arc > span{border-right:0;min-height:0;padding:2px 10px}
    .arc > span:first-child{padding-top:9px}
    .arc .tag{order:1} .arc .dt{order:2;justify-content:flex-end}
    .arc .d{order:3;grid-column:1/-1;white-space:normal}
    .arc .st{order:4} .arc .cw{order:5;justify-content:flex-end;padding-bottom:9px}
    .arc .a-undo{position:absolute;top:8px;right:38px;padding:0;border:0}
    .arc .a-kill{position:absolute;top:8px;right:8px;padding:0;border:0}
    section{margin:0 10px 20px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="titolo">
      <div>
        <p class="eyebrow">Controlling · gestione attività</p>
        <h1>Cruscotto attività</h1>
      </div>
    </div>
    <div class="meters">
      <div class="meter"><b id="m-open">0</b><span>aperte</span></div>
      <div class="meter wip"><b id="m-wip">0</b><span>in corso</span></div>
      <div class="meter alert"><b id="m-late">0</b><span>scadute</span></div>
      <div class="meter ok"><b id="m-done">0</b><span>completate</span></div>
    </div>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="toolbar"><span class="saved" id="saved">salvato</span></div>
  <div id="board"></div>
</div>

<script>
const SEZIONI = [
  {id:'urgenti',    titolo:'To be done',  acc:'var(--rosso)',   nota:'Da fare, ancora non avviate'},
  {id:'giornaliere',titolo:'Giornaliere', acc:'var(--verde)', nota:'Routine e controlli quotidiani'},
  {id:'mensili',    titolo:'Mensili',     acc:'var(--azzurro)',  nota:'Chiusura, reporting, consolidato'}
];
const KEY = 'attivita-lavoro';
const STATI = [['todo','Da iniziare'],['wip','WIP'],['done','✓ Completato']];
const ETICHETTA = {todo:'Da iniziare', wip:'WIP', done:'Completato'};
const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const STELLA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.5-5.8-3.05L6.2 20.55l1.1-6.5-4.7-4.6 6.5-.95z"/></svg>';

let dati = {urgenti:[],giornaliere:[],mensili:[],archivio:[]};
let vista = 'riepilogo';
const noteAperte = new Set();
const uid = () => Math.random().toString(36).slice(2,9);
const oggi = () => new Date().toISOString().slice(0,10);
const sezDi = id => SEZIONI.find(s => s.id === id) || SEZIONI[0];
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const dataIt = d => d ? d.split('-').reverse().join('.') : '—';
const nomeMese = ym => {
  const [y,m] = ym.split('-').map(Number);
  return MESI[(m||1)-1] + ' ' + y;
};
function meseDopo(iso){
  const [y,m,g] = iso.split('-').map(Number);
  const giorniNel = new Date(y, m+1, 0).getDate();
  const d = new Date(y, m, Math.min(g, giorniNel));
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* ---------- persistenza ---------- */
function carica(){
  try{
    const grezzo = localStorage.getItem(KEY);
    if(grezzo){
      const p = JSON.parse(grezzo);
      SEZIONI.forEach(s => { if(Array.isArray(p[s.id])) dati[s.id] = p[s.id]; });
      if(Array.isArray(p.archivio)) dati.archivio = p.archivio;
    }
  }catch(e){ console.error('lettura non riuscita', e); }

  // migrazione: completate rimaste dentro le sezioni finiscono in archivio
  let migrate = false;
  SEZIONI.forEach(s => {
    const fatte = dati[s.id].filter(a => a.stato === 'done');
    if(!fatte.length) return;
    migrate = true;
    dati[s.id] = dati[s.id].filter(a => a.stato !== 'done');
    fatte.forEach(a => dati.archivio.push(
      Object.assign({}, a, {sez:s.id, completato:a.completato || a.scadenza || oggi()})));
  });
  if(migrate) salva();
}
let t;
function salva(){
  clearTimeout(t);
  t = setTimeout(() => {
    try{
      localStorage.setItem(KEY, JSON.stringify(dati));
      const s = document.getElementById('saved');
      if(s && s.textContent === 'salvato'){ s.classList.add('on'); setTimeout(()=>s.classList.remove('on'),1200); }
    }catch(e){
      console.error('salvataggio non riuscito', e);
      const s = document.getElementById('saved');
      if(s){ s.textContent = 'salvataggio non riuscito'; s.style.color = 'var(--rosso)'; s.classList.add('on'); }
    }
  }, 400);
}
function avvisa(msg){
  const s = document.getElementById('saved');
  if(!s) return;
  s.textContent = msg; s.classList.add('on');
  clearTimeout(avvisa.t);
  avvisa.t = setTimeout(() => { s.classList.remove('on'); s.textContent = 'salvato'; }, 2600);
}

/* ---------- tab ---------- */
function tabs(){
  const box = document.getElementById('tabs');
  const voci = [{id:'riepilogo',titolo:'Riepilogo',acc:'var(--ambra)'}, ...SEZIONI,
                {id:'completati',titolo:'Completati',acc:'var(--verde)'}];
  box.innerHTML = voci.map(v => {
    let n;
    if(v.id === 'riepilogo') n = SEZIONI.reduce((k,s) => k + dati[s.id].length, 0);
    else if(v.id === 'completati') n = dati.archivio.length;
    else n = dati[v.id].length;
    return `<button class="tab" role="tab" data-tab="${v.id}" style="--tacc:${v.acc}"
      aria-selected="${vista===v.id}">${v.titolo}<span class="n">${n}</span></button>`;
  }).join('');
}

/* ---------- render ---------- */
function render(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  if(vista === 'riepilogo') riepilogo(board);
  else if(vista === 'completati') completati(board);
  else board.appendChild(blocco(sezDi(vista)));
  tabs();
  contatori();
}

function blocco(sez){
  const el = document.createElement('section');
  el.style.setProperty('--acc', sez.acc);
  el.dataset.sec = sez.id;
  const lista = dati[sez.id];
  const wip = lista.filter(a => a.stato === 'wip').length;

  el.innerHTML = `
    <div class="sec-head">
      <h2>${sez.titolo}</h2>
      <span class="tally">${lista.length} aperte / ${wip} in corso</span>
      <button class="btn" data-add="${sez.id}">+ Nuova attività</button>
    </div>
    <div class="cols">
      <span>Attività</span><span>Scadenza</span><span>Priorità</span>
      <span>Collega</span><span>Stato</span>${sez.id === 'urgenti' ? '<span>Copia</span>' : ''}<span>Note</span><span></span>
    </div>
    <div class="body"></div>`;

  const body = el.querySelector('.body');
  if(!lista.length) body.innerHTML = `<div class="empty attaccato">${sez.nota} — aggiungi la prima attività.</div>`;
  else lista.forEach(a => body.appendChild(riga(a, sez.id)));
  return el;
}

function riga(a, sezId){
  const r = document.createElement('div');
  const late = a.scadenza && a.scadenza < oggi();
  const aperta = noteAperte.has(a.id);
  r.className = 'row' + (late ? ' late' : '');

  r.innerHTML = `
    <div class="f-desc"><input type="text" placeholder="Descrizione dell'attività" value="${esc(a.desc)}" data-f="desc"></div>
    <div data-label="Scadenza"><input type="date" value="${a.scadenza||''}" data-f="scadenza"></div>
    <div data-label="Priorità"><div class="stars" role="group" aria-label="Priorità"></div></div>
    <div class="f-cow" data-label="Collega"><input type="text" placeholder="—" value="${esc(a.coworker)}" data-f="coworker"></div>
    <div data-label="Stato">
      <select data-f="stato" data-v="${a.stato}">
        ${STATI.map(([v,l]) => `<option value="${v}" ${a.stato===v?'selected':''}>${l}</option>`).join('')}
      </select>
    </div>
    ${sezId === 'urgenti' ? `<div class="f-dup"><button class="icon dup" title="Duplica in Giornaliere" aria-label="Duplica in Giornaliere">⧉</button></div>` : ''}
    <div class="f-note"><button class="icon note${(a.nota||'').trim()?' has':''}" aria-expanded="${aperta}"
      title="Note e criticità" aria-label="Note e criticità">💬</button></div>
    <div class="f-kill"><button class="icon kill" title="Elimina" aria-label="Elimina attività">×</button></div>
    <div class="nota" hidden>
      <span class="lbl">Note / criticità</span>
      <textarea placeholder="Criticità, dipendenze, cosa manca…" data-f="nota">${esc(a.nota)}</textarea>
    </div>`;

  const box = r.querySelector('.stars');
  for(let i=1;i<=3;i++){
    const b = document.createElement('button');
    b.type = 'button'; b.innerHTML = STELLA;
    b.className = i <= (a.prio||0) ? 'lit' : '';
    b.setAttribute('aria-label', i + ' stelle');
    b.onclick = () => { a.prio = (a.prio === i) ? 0 : i; salva(); render(); };
    box.appendChild(b);
  }

  const pannello = r.querySelector('.nota');
  const bottone = r.querySelector('.icon.note');
  pannello.hidden = !aperta;
  bottone.onclick = () => {
    const ora = pannello.hidden;
    pannello.hidden = !ora;
    bottone.setAttribute('aria-expanded', String(ora));
    if(ora){ noteAperte.add(a.id); pannello.querySelector('textarea').focus(); }
    else noteAperte.delete(a.id);
  };

  r.querySelectorAll('[data-f]').forEach(inp => {
    inp.addEventListener('change', () => {
      if(inp.dataset.f === 'stato' && inp.value === 'done') return completa(a, sezId);
      a[inp.dataset.f] = inp.value; salva();
      if(inp.dataset.f === 'stato' || inp.dataset.f === 'scadenza') render(); else contatori();
    });
    if(inp.tagName === 'TEXTAREA')
      inp.addEventListener('input', () => {
        a.nota = inp.value; salva();
        bottone.classList.toggle('has', !!inp.value.trim());
      });
    else if(inp.type === 'text')
      inp.addEventListener('input', () => { a[inp.dataset.f] = inp.value; salva(); });
  });

  const copia = r.querySelector('.icon.dup');
  if(copia) copia.onclick = () => {
    dati.giornaliere.push(Object.assign({}, a, {id: uid()}));
    salva(); render(); avvisa('copiata in giornaliere');
  };

  r.querySelector('.kill').onclick = () => {
    dati[sezId] = dati[sezId].filter(x => x.id !== a.id);
    noteAperte.delete(a.id); salva(); render();
  };
  return r;
}

/* ---------- completamento ---------- */
function completa(a, sezId){
  dati[sezId] = dati[sezId].filter(x => x.id !== a.id);
  noteAperte.delete(a.id);
  dati.archivio.push(Object.assign({}, a, {stato:'done', sez:sezId, completato:oggi()}));

  let msg = 'archiviata in completati';
  if(sezId === 'mensili'){
    const prossima = Object.assign({}, a, {
      id: uid(), stato:'todo',
      scadenza: meseDopo(a.scadenza || oggi())
    });
    dati.mensili.push(prossima);
    msg = 'archiviata · ricreata al ' + dataIt(prossima.scadenza);
  }
  salva(); render(); avvisa(msg);
}

/* ---------- riepilogo ---------- */
function riepilogo(board){
  const cards = document.createElement('div');
  cards.className = 'cards';
  SEZIONI.forEach(s => {
    const l = dati[s.id];
    const wip = l.filter(a => a.stato === 'wip').length;
    const late = l.filter(a => a.scadenza && a.scadenza < oggi()).length;
    const fatte = dati.archivio.filter(v => v.sez === s.id).length;
    const c = document.createElement('button');
    c.className = 'card'; c.style.setProperty('--acc', s.acc); c.dataset.tab = s.id;
    c.innerHTML = `<h3>${s.titolo}</h3>
      <div class="big">${l.length}<em>aperte</em></div>
      <div class="split"><span>${wip} in corso</span>
      <span class="${late?'bad':''}">${late} scadute</span>
      <span>${fatte} completate</span></div>`;
    cards.appendChild(c);
  });
  board.appendChild(cards);

  const critiche = SEZIONI.flatMap(s => dati[s.id].map(a => ({a, sez:s})))
    .filter(x => x.a.prio === 3)
    .sort((x,y) => {
      const dx = x.a.scadenza || '9999', dy = y.a.scadenza || '9999';
      return dx < dy ? -1 : dx > dy ? 1 : 0;
    });

  const sez = document.createElement('section');
  sez.innerHTML = `<p class="lead">Priorità massima <span class="st">★★★</span></p>
    <p class="sub">Solo le attività aperte con tre stelle, ordinate per scadenza. Clicca una riga per aprire la scheda.</p>
    <div class="top"></div>`;
  const box = sez.querySelector('.top');

  if(!critiche.length){
    box.outerHTML = `<div class="empty">Nessuna attività a tre stelle al momento.</div>`;
  } else {
    critiche.forEach(x => {
      const a = x.a, late = a.scadenza && a.scadenza < oggi();
      const el = document.createElement('div');
      el.className = 'top-row';
      el.style.setProperty('--acc', x.sez.acc);
      el.dataset.tab = x.sez.id;
      el.innerHTML = `
        <span class="tag">${x.sez.titolo}</span>
        <span class="d">${esc(a.desc) || '<span style="color:var(--debole)">senza descrizione</span>'}${(a.nota||'').trim()?'<span class="flag" title="Ha note">●</span>':''}</span>
        <span class="dt ${late?'bad':''}">${dataIt(a.scadenza)}</span>
        <span class="cw">${esc(a.coworker) || '—'}</span>
        <span class="badge ${a.stato}">${ETICHETTA[a.stato]}</span>`;
      box.appendChild(el);
    });
  }
  board.appendChild(sez);
  board.appendChild(pannelloBackup());
}

/* ---------- completati, per mese ---------- */
function completati(board){
  const testa = document.createElement('section');
  testa.innerHTML = `<p class="lead">Completati</p>
    <p class="sub">Archivio delle attività chiuse, raggruppate per mese di completamento.
      Con ↺ rimetti un'attività nella sua scheda di origine.</p>`;
  board.appendChild(testa);

  if(!dati.archivio.length){
    const v = document.createElement('div');
    v.className = 'empty';
    v.textContent = 'Nessuna attività completata finora.';
    board.appendChild(v);
    board.appendChild(pannelloBackup());
    return;
  }

  const perMese = {};
  dati.archivio.forEach(v => {
    const k = (v.completato || '').slice(0,7) || '0000-00';
    (perMese[k] = perMese[k] || []).push(v);
  });

  Object.keys(perMese).sort().reverse().forEach(k => {
    const voci = perMese[k].sort((a,b) => (b.completato||'') < (a.completato||'') ? -1 : 1);
    const blocco = document.createElement('div');
    blocco.className = 'mese';
    blocco.innerHTML = `<div class="mese-head">
      <h3>${k === '0000-00' ? 'Senza data' : nomeMese(k)}</h3>
      <span class="c">${voci.length} ${voci.length === 1 ? 'attività' : 'attività'}</span></div>`;

    voci.forEach(v => {
      const s = sezDi(v.sez);
      const el = document.createElement('div');
      el.className = 'arc';
      el.style.setProperty('--acc', s.acc);
      const stelle = '★'.repeat(v.prio||0) + '<span style="color:#4F4F4F">' + '★'.repeat(3-(v.prio||0)) + '</span>';
      el.innerHTML = `
        <span class="tag">${s.titolo}</span>
        <span class="d">${esc(v.desc) || '<span style="color:var(--debole)">senza descrizione</span>'}${(v.nota||'').trim()?'<span class="flag" title="Ha note">●</span>':''}</span>
        <span class="dt">${dataIt(v.completato)}</span>
        <span class="st" style="color:var(--ambra);font-size:12px">${stelle}</span>
        <span class="cw">${esc(v.coworker) || '—'}</span>
        <span class="a-undo"><button class="icon undo" title="Rimetti tra le attività aperte" aria-label="Ripristina">↺</button></span>
        <span class="a-kill"><button class="icon kill" title="Elimina definitivamente" aria-label="Elimina">×</button></span>`;

      el.querySelector('.undo').onclick = () => {
        dati.archivio = dati.archivio.filter(x => x !== v);
        const dest = SEZIONI.some(s2 => s2.id === v.sez) ? v.sez : 'urgenti';
        const rientro = Object.assign({}, v, {stato:'todo'});
        delete rientro.sez; delete rientro.completato;
        dati[dest].push(rientro);
        salva(); render(); avvisa('ripristinata in ' + sezDi(dest).titolo.toLowerCase());
      };
      el.querySelector('.kill').onclick = () => {
        if(!confirm('Eliminare definitivamente questa attività dall\'archivio?')) return;
        dati.archivio = dati.archivio.filter(x => x !== v);
        salva(); render();
      };
      blocco.appendChild(el);
    });
    board.appendChild(blocco);
  });
  board.appendChild(pannelloBackup());
}

/* ---------- backup ---------- */
function pannelloBackup(){
  const s = document.createElement('section');
  s.innerHTML = `<p class="lead">Backup</p>
    <p class="sub">L'esportazione salva tutte le attività, note e archivio compresi, in un file .json.
      L'importazione può sostituire l'archivio oppure aggiungere le attività del file a quelle già presenti.</p>
    <div class="backup">
      <div class="acts">
        <button class="btn" id="exp">Esporta backup</button>
        <button class="btn" id="imp-rep">Importa e sostituisci</button>
        <button class="btn" id="imp-add">Importa e aggiungi</button>
        <span class="esito" id="esito"></span>
      </div>
      <input type="file" id="file" accept="application/json,.json" hidden>
    </div>`;

  const esito = (msg, cls='') => {
    const e = document.getElementById('esito');
    if(e){ e.textContent = msg; e.className = 'esito ' + cls; }
  };

  s.querySelector('#exp').onclick = () => {
    const pacco = {app:'attivita-lavoro', versione:3, esportato:new Date().toISOString(),
      dati:{urgenti:dati.urgenti, giornaliere:dati.giornaliere, mensili:dati.mensili, archivio:dati.archivio}};
    const url = URL.createObjectURL(new Blob([JSON.stringify(pacco,null,2)],{type:'application/json'}));
    const a = document.createElement('a');
    a.href = url; a.download = `attivita-backup-${oggi()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    const n = SEZIONI.reduce((k,x) => k + dati[x.id].length, 0) + dati.archivio.length;
    esito(`${n} attività esportate`, 'ok');
  };

  let modo = 'sostituisci';
  const file = s.querySelector('#file');
  s.querySelector('#imp-rep').onclick = () => { modo='sostituisci'; file.value=''; file.click(); };
  s.querySelector('#imp-add').onclick = () => { modo='aggiungi';    file.value=''; file.click(); };

  const pulisci = a => ({
    id: a.id || uid(),
    desc: String(a.desc || ''),
    scadenza: /^\d{4}-\d{2}-\d{2}$/.test(a.scadenza || '') ? a.scadenza : '',
    prio: [0,1,2,3].includes(a.prio) ? a.prio : 0,
    coworker: String(a.coworker || ''),
    stato: ['todo','wip','done'].includes(a.stato) ? a.stato : 'todo',
    nota: String(a.nota || '')
  });

  file.onchange = () => {
    const f = file.files && file.files[0];
    if(!f) return;
    const lettore = new FileReader();
    lettore.onload = () => {
      let p;
      try{ p = JSON.parse(lettore.result); }
      catch(e){ return esito('File non leggibile: non è un .json valido', 'ko'); }
      const src = p && p.dati ? p.dati : p;
      if(!src || !(SEZIONI.some(x => Array.isArray(src[x.id])) || Array.isArray(src.archivio)))
        return esito('File non compatibile: nessuna attività trovata', 'ko');

      const pulite = {archivio:[]}; let n = 0;
      SEZIONI.forEach(x => {
        pulite[x.id] = (Array.isArray(src[x.id]) ? src[x.id] : []).map(pulisci);
        n += pulite[x.id].length;
      });
      pulite.archivio = (Array.isArray(src.archivio) ? src.archivio : []).map(a => Object.assign(pulisci(a), {
        stato:'done',
        sez: SEZIONI.some(x => x.id === a.sez) ? a.sez : 'urgenti',
        completato: /^\d{4}-\d{2}-\d{2}$/.test(a.completato || '') ? a.completato : oggi()
      }));
      n += pulite.archivio.length;

      if(modo === 'sostituisci'){
        const attuali = SEZIONI.reduce((k,x) => k + dati[x.id].length, 0) + dati.archivio.length;
        if(attuali && !confirm(`Sostituire le ${attuali} attività attuali con le ${n} del file?`))
          return esito('Importazione annullata');
        dati = pulite;
      } else {
        [...SEZIONI.map(x => x.id), 'archivio'].forEach(k => {
          const presenti = new Set(dati[k].map(a => a.id));
          pulite[k].forEach(a => { if(presenti.has(a.id)) a.id = uid(); dati[k].push(a); });
        });
      }
      salva(); render(); esito(`${n} attività importate`, 'ok');
    };
    lettore.readAsText(f);
  };
  return s;
}

function contatori(){
  const tutte = SEZIONI.flatMap(s => dati[s.id]);
  const set = (id,n) => document.getElementById(id).textContent = n;
  set('m-open', tutte.length);
  set('m-wip',  tutte.filter(a => a.stato === 'wip').length);
  set('m-late', tutte.filter(a => a.scadenza && a.scadenza < oggi()).length);
  set('m-done', dati.archivio.length);
}

/* ---------- eventi ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if(tab){ vista = tab.dataset.tab; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const b = e.target.closest('[data-add]');
  if(!b) return;
  dati[b.dataset.add].push({id:uid(),desc:'',scadenza:'',prio:0,coworker:'',stato:'todo',nota:''});
  salva(); render();
  const campi = document.querySelectorAll(`section[data-sec="${b.dataset.add}"] .f-desc input`);
  if(campi.length) campi[campi.length-1].focus();
});

carica(); render();
</script>
